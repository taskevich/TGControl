services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tgcontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tgcontrol}
      POSTGRES_DB: ${POSTGRES_DB:-tgcontrol}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tgcontrol}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  s3:
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-tgcontrol}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-tgcontrol-secret}
    volumes:
      - s3data:/data

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tgcontrol}:${POSTGRES_PASSWORD:-tgcontrol}@postgres:5432/${POSTGRES_DB:-tgcontrol}
      REDIS_URL: redis://redis:6379/0
      S3_BUCKET: ${S3_BUCKET:-tgcontrol-media}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://s3:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-tgcontrol}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-tgcontrol-secret}
    volumes:
      - mediatmp:/tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${PANEL_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  s3data:
  mediatmp:
